<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%" role="img" aria-label="Illustration of the bride in a Sindhi wedding outfit welcoming you">
  <defs>
    <linearGradient id="lehengaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C82333"/>
      <stop offset="40%" stop-color="#A71D2A"/>
      <stop offset="85%" stop-color="#7A1F2B"/>
      <stop offset="100%" stop-color="#540B0E"/>
    </linearGradient>
    <linearGradient id="dupattaSheer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#9E2A2B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7A1F2B" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="goldZariBride" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="skinGradBride" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FADBD8"/>
      <stop offset="50%" stop-color="#F5CBA7"/>
      <stop offset="100%" stop-color="#E59866"/>
    </linearGradient>
    <filter id="brideGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7A1F2B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="bride-avatar" filter="url(#brideGlow)">
    <!-- Bridal Lehenga Skirt & Choli -->
    <g id="lehenga-choli">
      <!-- Lehenga Flare -->
      <path d="M 210 520 L 120 850 L 480 850 L 390 520 Z" fill="url(#lehengaRed)" stroke="#B8860B" stroke-width="2"/>
      <!-- Sindhi / Ajrak Inspired Geometric Zari Embroidery Band at hem -->
      <path d="M 120 810 L 480 810 L 480 850 L 120 850 Z" fill="url(#goldZariBride)"/>
      <!-- Ajrak geometric star motif accents on hem -->
      <g fill="#7A1F2B">
        <polygon points="160,820 166,826 160,832 154,826"/>
        <polygon points="200,820 206,826 200,832 194,826"/>
        <polygon points="240,820 246,826 240,832 234,826"/>
        <polygon points="280,820 286,826 280,832 274,826"/>
        <polygon points="320,820 326,826 320,832 314,826"/>
        <polygon points="360,820 366,826 360,832 354,826"/>
        <polygon points="400,820 406,826 400,832 394,826"/>
        <polygon points="440,820 446,826 440,832 434,826"/>
      </g>
      <!-- Zari embroidery buttas on lehenga -->
      <g fill="url(#goldZariBride)">
        <circle cx="200" cy="650" r="4"/><circle cx="250" cy="720" r="4"/><circle cx="300" cy="630" r="4"/>
        <circle cx="350" cy="720" r="4"/><circle cx="400" cy="650" r="4"/><circle cx="280" cy="760" r="4"/>
        <circle cx="330" cy="760" r="4"/>
      </g>
      <!-- Choli / Blouse -->
      <path d="M 210 430 L 205 520 L 395 520 L 390 430 Z" fill="url(#lehengaRed)" stroke="#B8860B" stroke-width="1.5"/>
      <path d="M 205 510 L 395 510 L 395 520 L 205 520 Z" fill="url(#goldZariBride)"/>
    </g>

    <!-- Neck & Heavy Bridal Jewellery (Sindhi Hasli & Choker) -->
    <g id="bride-neck">
      <path d="M 270 365 L 270 430 C 285 442 315 442 330 430 L 330 365 Z" fill="url(#skinGradBride)"/>
      <!-- Gold Choker Necklace -->
      <path d="M 268 400 C 285 422 315 422 332 400" fill="none" stroke="url(#goldZariBride)" stroke-width="8" stroke-linecap="round"/>
      <!-- Kundan Emerald/Ruby gemstones in choker -->
      <circle cx="280" cy="409" r="2.5" fill="#7A1F2B"/>
      <circle cx="290" cy="413" r="2.5" fill="#2D6A4F"/>
      <circle cx="300" cy="415" r="3.5" fill="#7A1F2B"/>
      <circle cx="310" cy="413" r="2.5" fill="#2D6A4F"/>
      <circle cx="320" cy="409" r="2.5" fill="#7A1F2B"/>
      <!-- Hanging Pearl Latkan Drops on Necklace -->
      <circle cx="290" cy="421" r="2" fill="#FFFDF7"/>
      <circle cx="300" cy="425" r="2.5" fill="#FFFDF7"/>
      <circle cx="310" cy="421" r="2" fill="#FFFDF7"/>
    </g>

    <!-- Bridal Hair -->
    <g id="hair">
      <ellipse cx="300" cy="275" rx="72" ry="72" fill="#1C100B"/>
      <!-- Parting in hair (Maang) -->
      <line x1="300" y1="210" x2="300" y2="245" stroke="#E59866" stroke-width="2"/>
      <line x1="300" y1="215" x2="300" y2="240" stroke="#C82333" stroke-width="2.5"/> <!-- Sindoor -->
    </g>

    <!-- Face & Features -->
    <g id="bride-face">
      <!-- Face shape -->
      <path d="M 245 265 C 245 365 355 365 355 265 C 355 225 245 225 245 265 Z" fill="url(#skinGradBride)" stroke="#D48B55" stroke-width="1.2"/>
      <!-- Delicate Eyebrows -->
      <path d="M 264 262 Q 278 254 290 262" stroke="#1C100B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 310 262 Q 322 254 336 262" stroke="#1C100B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Almond Shaped Eyes with Kohl (Kajal) -->
      <ellipse cx="277" cy="274" rx="7" ry="5" fill="#1C100B"/>
      <ellipse cx="323" cy="274" rx="7" ry="5" fill="#1C100B"/>
      <circle cx="279" cy="272" r="2" fill="#FFFFFF"/>
      <circle cx="325" cy="272" r="2" fill="#FFFFFF"/>
      <!-- Winged Eyeliner / Kajal wing -->
      <path d="M 266 274 Q 277 268 286 274 Q 289 272 291 270" stroke="#1C100B" stroke-width="1.8" fill="none"/>
      <path d="M 309 270 Q 311 272 314 274 Q 323 268 334 274" stroke="#1C100B" stroke-width="1.8" fill="none"/>
      <!-- Gentle Eyelashes -->
      <path d="M 270 270 L 268 266 M 277 268 L 277 264 M 284 270 L 286 266" stroke="#1C100B" stroke-width="1"/>
      <path d="M 316 270 L 314 266 M 323 268 L 323 264 M 330 270 L 332 266" stroke="#1C100B" stroke-width="1"/>
      <!-- Small delicate Nose -->
      <path d="M 300 270 Q 302 294 297 298 Q 300 302 304 298" stroke="#D48B55" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- Traditional Bridal Nath (Nose Ring) with delicate chain to ear -->
      <circle cx="294" cy="298" r="4.5" fill="none" stroke="url(#goldZariBride)" stroke-width="1.5"/>
      <circle cx="294" cy="302" r="1.5" fill="#FFFDF7"/> <!-- Pearl drop on nath -->
      <path d="M 292 298 Q 265 295 248 290" stroke="url(#goldZariBride)" stroke-width="1" stroke-dasharray="1.5,2.5" fill="none"/>
      <!-- Auspicious Bridal Bindi -->
      <circle cx="300" cy="254" r="3" fill="#C82333"/>
      <circle cx="300" cy="254" r="1" fill="#FFD54F"/>
      <!-- Gentle Cheerful Smile (Deep Ruby lips) -->
      <path d="M 288 322 Q 300 334 312 322" stroke="#A71D2A" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 289 321 Q 300 327 311 321" fill="#C82333"/>
      <!-- Dimple / Glow -->
      <ellipse cx="266" cy="305" rx="7" ry="4" fill="#FADBD8" opacity="0.6"/>
      <ellipse cx="334" cy="305" rx="7" ry="4" fill="#FADBD8" opacity="0.6"/>
    </g>

    <!-- Maang Tikka (Sindhi bridal forehead ornament) -->
    <g id="maang-tikka">
      <line x1="300" y1="210" x2="300" y2="242" stroke="url(#goldZariBride)" stroke-width="2"/>
      <circle cx="300" cy="245" r="7" fill="url(#goldZariBride)" stroke="#7A1F2B" stroke-width="1.5"/>
      <circle cx="300" cy="245" r="3.5" fill="#7A1F2B"/>
      <circle cx="300" cy="252" r="2" fill="#FFFDF7"/>
    </g>

    <!-- Jhumka Earrings -->
    <g id="earrings">
      <!-- Left Earring -->
      <circle cx="242" cy="305" r="3" fill="url(#goldZariBride)"/>
      <path d="M 236 312 Q 242 308 248 312 L 250 322 L 234 322 Z" fill="url(#goldZariBride)" stroke="#7A1F2B" stroke-width="0.8"/>
      <circle cx="242" cy="325" r="2" fill="#FFFDF7"/>
      <!-- Right Earring -->
      <circle cx="358" cy="305" r="3" fill="url(#goldZariBride)"/>
      <path d="M 352 312 Q 358 308 364 312 L 366 322 L 350 322 Z" fill="url(#goldZariBride)" stroke="#7A1F2B" stroke-width="0.8"/>
      <circle cx="358" cy="325" r="2" fill="#FFFDF7"/>
    </g>

    <!-- Bridal Dupatta (Veil draped delicately over hair and shoulders with gold border) -->
    <g id="dupatta">
      <!-- Arch over head -->
      <path d="M 220 280 C 215 155 385 155 380 280 C 400 360 410 500 425 650 C 405 650 380 500 375 360 C 375 220 225 220 225 360 C 220 500 195 650 175 650 C 190 500 200 360 220 280 Z" fill="url(#dupattaSheer)" stroke="#B8860B" stroke-width="2"/>
      <!-- Scalloped Zari Kiran Border on Dupatta -->
      <path d="M 215 280 C 210 150 390 150 385 280" fill="none" stroke="url(#goldZariBride)" stroke-width="7"/>
      <path d="M 215 280 C 210 150 390 150 385 280" fill="none" stroke="#FFE082" stroke-width="2" stroke-dasharray="3,3"/>
      <!-- Ajrak-inspired star embroidery motifs on dupatta edge -->
      <circle cx="300" cy="180" r="4" fill="url(#goldZariBride)"/>
      <circle cx="260" cy="195" r="3.5" fill="url(#goldZariBride)"/>
      <circle cx="340" cy="195" r="3.5" fill="url(#goldZariBride)"/>
      <circle cx="230" cy="235" r="3.5" fill="url(#goldZariBride)"/>
      <circle cx="370" cy="235" r="3.5" fill="url(#goldZariBride)"/>
    </g>

    <!-- Arms & Namaste / Welcoming Pose with Mehendi and Bangles -->
    <g id="bride-namaste">
      <!-- Left Upper Arm -->
      <path d="M 210 440 C 170 500 190 575 250 575 L 260 540 C 220 530 200 480 225 440 Z" fill="url(#lehengaRed)" stroke="#B8860B" stroke-width="1.5"/>
      <!-- Right Upper Arm -->
      <path d="M 390 440 C 430 500 410 575 350 575 L 340 540 C 380 530 400 480 375 440 Z" fill="url(#lehengaRed)" stroke="#B8860B" stroke-width="1.5"/>

      <!-- Forearms with delicate Mehendi/Henna patterns -->
      <path d="M 250 575 C 270 565 285 530 290 500 L 275 490 C 265 520 245 545 235 550 Z" fill="url(#skinGradBride)"/>
      <path d="M 350 575 C 330 565 315 530 310 500 L 325 490 C 335 520 355 545 365 550 Z" fill="url(#skinGradBride)"/>

      <!-- Red & Gold Bridal Chooda / Bangles on both wrists -->
      <!-- Left wrist bangles -->
      <g transform="rotate(25, 275, 520)">
        <rect x="268" y="514" width="14" height="3" fill="url(#goldZariBride)"/>
        <rect x="268" y="518" width="14" height="4" fill="#C82333"/>
        <rect x="268" y="523" width="14" height="4" fill="#C82333"/>
        <rect x="268" y="528" width="14" height="3" fill="url(#goldZariBride)"/>
      </g>
      <!-- Right wrist bangles -->
      <g transform="rotate(-25, 325, 520)">
        <rect x="318" y="514" width="14" height="3" fill="url(#goldZariBride)"/>
        <rect x="318" y="518" width="14" height="4" fill="#C82333"/>
        <rect x="318" y="523" width="14" height="4" fill="#C82333"/>
        <rect x="318" y="528" width="14" height="3" fill="url(#goldZariBride)"/>
      </g>

      <!-- Hands in Namaste (Folded Palms with Mehendi) -->
      <g id="bride-folded-hands">
        <path d="M 288 470 C 285 450 296 430 300 420 C 304 430 315 450 312 470 C 310 495 290 495 288 470 Z" fill="url(#skinGradBride)" stroke="#D48B55" stroke-width="1.2"/>
        <!-- Mehendi mandala on back of hands -->
        <circle cx="300" cy="455" r="4" fill="#7A1F2B" opacity="0.8"/>
        <circle cx="300" cy="455" r="1.5" fill="#FFE082"/>
        <!-- Mehendi on fingertips -->
        <path d="M 296 422 Q 300 420 304 422 L 303 430 L 297 430 Z" fill="#7A1F2B"/>
        <!-- Finger lines -->
        <line x1="295" y1="438" x2="295" y2="465" stroke="#C87D45" stroke-width="1"/>
        <line x1="305" y1="438" x2="305" y2="465" stroke="#C87D45" stroke-width="1"/>
        <!-- Gold ring on finger -->
        <circle cx="292" cy="456" r="2" fill="url(#goldZariBride)"/>
      </g>
    </g>
  </g>
</svg>
