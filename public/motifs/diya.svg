  <ellipse cx="50" cy="63" rx="30" ry="8" fill="#F4A02B" stroke="#B8860B" stroke-width="1.5"/>
  <ellipse cx="50" cy="62" rx="25" ry="5" fill="#E65100" opacity="0.6"/>
