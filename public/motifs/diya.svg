  <path d="M 40 85 L 60 85 L 64 92 L 36 92 Z" fill="#B8860B"/>
  <ellipse cx="50" cy="85" rx="14" ry="4" fill="#B8860B"/>
  <!-- Diya Clay/Brass Pot -->
