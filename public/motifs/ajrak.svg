<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Sindhi Ajrak Geometric Tile Motif (Indigo/Crimson/Terracotta tradition) -->
  <defs>
    <radialGradient id="ajrakCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="60%" stop-color="#C8553D"/>
      <stop offset="100%" stop-color="#7A1F2B"/>
    </radialGradient>
  </defs>
  <!-- Outer border square -->
  <rect x="5" y="5" width="110" height="110" rx="8" fill="none" stroke="#C8553D" stroke-width="2.5"/>
  <rect x="10" y="10" width="100" height="100" rx="4" fill="#C8553D" fill-opacity="0.08" stroke="#B8860B" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- Central 8-pointed star (Khatam / Ajrak Star) -->
  <g transform="translate(60,60)">
    <!-- Star 1 -->
    <polygon points="0,-36 25,-25 36,0 25,25 0,36 -25,25 -36,0 -25,-25" fill="#7A1F2B" stroke="#B8860B" stroke-width="1.5"/>
    <!-- Rotated 45 deg star -->
    <polygon points="0,-36 25,-25 36,0 25,25 0,36 -25,25 -36,0 -25,-25" transform="rotate(45)" fill="#C8553D" fill-opacity="0.75" stroke="#FFF8EC" stroke-width="1"/>
    <!-- Core Medallion -->
    <circle cx="0" cy="0" r="14" fill="url(#ajrakCenter)" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#FFFDF7"/>
    <!-- 8 surrounding dots (Sindhi Chundri/Ajrak dot accents) -->
    <circle cx="0" cy="-22" r="2.5" fill="#FFF8EC"/>
    <circle cx="16" cy="-16" r="2.5" fill="#FFF8EC"/>
    <circle cx="22" cy="0" r="2.5" fill="#FFF8EC"/>
    <circle cx="16" cy="16" r="2.5" fill="#FFF8EC"/>
    <circle cx="0" cy="22" r="2.5" fill="#FFF8EC"/>
    <circle cx="-16" cy="16" r="2.5" fill="#FFF8EC"/>
    <circle cx="-22" cy="0" r="2.5" fill="#FFF8EC"/>
    <circle cx="-16" cy="-16" r="2.5" fill="#FFF8EC"/>
  </g>
  <!-- Corner trefoils -->
  <circle cx="20" cy="20" r="4" fill="#C8553D"/>
  <circle cx="100" cy="20" r="4" fill="#C8553D"/>
  <circle cx="20" cy="100" r="4" fill="#C8553D"/>
  <circle cx="100" cy="100" r="4" fill="#C8553D"/>
</svg>
